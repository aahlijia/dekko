name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
        include:
          # One leg installs the optional extras. Without it nothing
          # behind an extra ever runs here: every Tier-2 test skips
          # when the grammar pack is absent, which is how a Tier-2
          # language can stop working with every leg still green. The
          # pack fetches grammars on first use, so this leg needs the
          # network at test time. The other five stay a default
          # install, which is what most users have.
          - os: ubuntu-latest
            python: '3.13'
            extras: --all-extras
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --locked ${{ matrix.extras }}
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Test
        run: uv run pytest --cov=dekko --cov-report=term-missing

  audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Export locked requirements
        run: >
          uv export --locked --format requirements-txt --no-hashes
          --no-emit-project -o requirements-audit.txt
      - name: pip-audit
        run: uvx pip-audit --strict -r requirements-audit.txt
