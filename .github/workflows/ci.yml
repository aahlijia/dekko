name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Windows is best-effort for 1.0.0: surface failures without gating
    # the merge until the cross-platform fixes are proven green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Test
        run: uv run pytest --cov=dekko --cov-report=term-missing

  audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    # Non-blocking: surfaces advisories for a human to triage without
    # gating merges on a signal that hasn't earned trust yet (grammar
    # packages in particular may carry advisories that don't apply to
    # how dekko uses them). Revisit once a few weeks of runs show the
    # noise level is low enough to gate on.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Export locked requirements
        run: >
          uv export --locked --format requirements-txt --no-hashes
          --no-emit-project -o requirements-audit.txt
      - name: pip-audit
        run: uvx pip-audit --strict -r requirements-audit.txt
